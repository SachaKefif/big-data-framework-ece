[project]
name = "object-storage-labs"
version = "0.1.0"
description = "Dataset generators for the Object Storage labs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.37.0",
]

[project.scripts]
dataset-users = "object_storage_labs.dataset_users:main"
dataset-orders = "object_storage_labs.dataset_orders:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
