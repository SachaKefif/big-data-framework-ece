postgresql:
  auth:
    username: polaris
    database: polaris
    existingSecret: polaris-db
  primary:
    initdb:
      scripts:
        01-schema.sql: |
          CREATE SCHEMA IF NOT EXISTS polaris_schema AUTHORIZATION polaris;
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

polaris:
  persistence:
    type: relational-jdbc
    relationalJdbc:
      secret:
        name: polaris-db
        username: username
        password: password
        jdbcUrl: jdbcUrl
  authentication:
    type: internal
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnv:
    - name: POLARIS_BOOTSTRAP_CREDENTIALS
      valueFrom:
        secretKeyRef:
          name: polaris-credential
          key: POLARIS_BOOTSTRAP_CREDENTIALS
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: polaris-s3
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: polaris-s3
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_SESSION_TOKEN
      valueFrom:
        secretKeyRef:
          name: polaris-s3
          key: AWS_SESSION_TOKEN
    - name: AWS_REGION
      value: us-east-1
  extraInitContainers:
    - name: initialize-realm
      image: apache/polaris-admin-tool:1.8.0
      command: ["/bin/sh", "-ec"]
      args:
        - |
          attempt=0
          while [ "$attempt" -lt 60 ]; do
            if result="$(java -jar /deployments/polaris-admin-tool.jar bootstrap \
              -r POLARIS -c "$POLARIS_BOOTSTRAP_CREDENTIALS" 2>&1)"; then
              exit 0
            fi
            echo "$result" | grep -q 'already been bootstrapped' && exit 0
            attempt=$((attempt + 1))
            sleep 3
          done
          echo "$result"
          exit 1
      env:
        - name: POLARIS_BOOTSTRAP_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: polaris-credential
              key: POLARIS_BOOTSTRAP_CREDENTIALS
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: polaris-db
              key: username
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: polaris-db
              key: password
        - name: QUARKUS_DATASOURCE_JDBC_URL
          valueFrom:
            secretKeyRef:
              name: polaris-db
              key: jdbcUrl
        - name: POLARIS_PERSISTENCE_TYPE
          value: relational-jdbc
